name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build-plugin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # RossCarlson.Vatsim.Vpilot.Plugins.dll is not published to NuGet and is
      # not committed to this repo (it's Ross Carlson's, not ours to
      # redistribute — see CONTRIBUTING.md). The repo owner base64-encodes
      # their local copy and stores it as the VPILOT_SDK_DLL_BASE64 repo
      # secret; CI decodes it here before building. Forked-repo PRs don't
      # get repo secrets (GitHub's default), so this step — and the build
      # below — will legitimately fail for external contributors until they
      # test locally per CONTRIBUTING.md.
      - name: Restore vPilot plugin SDK
        shell: bash
        env:
          VPILOT_SDK_DLL_BASE64: ${{ secrets.VPILOT_SDK_DLL_BASE64 }}
        run: |
          mkdir -p plugin/lib
          if [ -n "$VPILOT_SDK_DLL_BASE64" ]; then
            echo "$VPILOT_SDK_DLL_BASE64" | base64 --decode > plugin/lib/RossCarlson.Vatsim.Vpilot.Plugins.dll
          else
            echo "::warning::VPILOT_SDK_DLL_BASE64 secret not set — plugin build will fail. See CONTRIBUTING.md."
          fi

      - name: Build plugin
        run: dotnet build plugin/VPilotRemoteControl.csproj -c Release

      # Cross-job filesystem isn't shared, so the installer job (which may run
      # on a different runner) needs this passed explicitly.
      - name: Upload plugin build output
        uses: actions/upload-artifact@v4
        with:
          name: plugin-build
          path: plugin/bin/Release/net472/

  build-installer:
    runs-on: windows-latest
    needs: build-plugin
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download plugin build output
        uses: actions/download-artifact@v4
        with:
          name: plugin-build
          path: plugin/bin/Release/net472/

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: iscc installer\VPilotRemoteControl.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: installer/dist/*.exe

  build-swift-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: apps/swift

      - name: Build macOS app
        run: |
          xcodebuild build \
            -project VPilotRemote.xcodeproj \
            -scheme VPilotRemote-macOS \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
        working-directory: apps/swift

      - name: Build iOS app (simulator)
        run: |
          xcodebuild build \
            -project VPilotRemote.xcodeproj \
            -scheme VPilotRemote-iOS \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
        working-directory: apps/swift
