name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build-plugin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # NOTE: RossCarlson.Vatsim.Vpilot.Plugins.dll is not published to NuGet
      # and isn't committed to this repo (see CONTRIBUTING.md). CI restores it
      # from a private cache/secret in real deployment — as a placeholder,
      # this step is a no-op until that's set up. Contributors: see issue
      # tracker for "CI: restore vPilot SDK DLL" before this job will pass.
      - name: Restore vPilot plugin SDK (placeholder)
        run: echo "TODO — see CONTRIBUTING.md for local build instructions until this is automated"

      - name: Build plugin
        run: dotnet build plugin/VPilotRemoteControl.csproj -c Release
        continue-on-error: true # remove once the SDK restore step above is real

      # Cross-job filesystem isn't shared, so the installer job (which may run
      # on a different runner) needs this passed explicitly. if-no-files-found
      # is set to ignore since the build above is allowed to fail/produce
      # nothing until the SDK restore step is real.
      - name: Upload plugin build output
        uses: actions/upload-artifact@v4
        with:
          name: plugin-build
          path: plugin/bin/Release/net472/
          if-no-files-found: ignore

  build-installer:
    runs-on: windows-latest
    needs: build-plugin
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download plugin build output
        uses: actions/download-artifact@v4
        with:
          name: plugin-build
          path: plugin/bin/Release/net472/

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: iscc installer\VPilotRemoteControl.iss
        # Same placeholder situation as build-plugin: this needs the DLL from
        # the step above, which is a no-op until the SDK restore is real.
        continue-on-error: true

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: installer/dist/*.exe
          if-no-files-found: ignore

  build-swift-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: apps/swift

      - name: Build macOS app
        run: |
          xcodebuild build \
            -project VPilotRemote.xcodeproj \
            -scheme VPilotRemote-macOS \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
        working-directory: apps/swift

      - name: Build iOS app (simulator)
        run: |
          xcodebuild build \
            -project VPilotRemote.xcodeproj \
            -scheme VPilotRemote-iOS \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
        working-directory: apps/swift
